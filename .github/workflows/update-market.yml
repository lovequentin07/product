name: Update Market Prices

on:
  # 평일 매일 오전 10시 KST (UTC 01:00)
  schedule:
    - cron: '0 1 * * 1-5'
  # 수동 트리거 (테스트용)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. KAMIS API 데이터 수집 + D1 갱신
      - name: Fetch KAMIS data and update D1
        run: npx tsx src/market/scripts/update-kamis.ts
        env:
          # KAMIS 인증
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          # Cloudflare D1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # 5. 완료 알림 (선택사항)
      - name: Notify completion
        if: success()
        run: echo "✅ Market data update completed successfully"

      # 6. 실패 알림 (선택사항)
      - name: Notify failure
        if: failure()
        run: echo "❌ Market data update failed"
