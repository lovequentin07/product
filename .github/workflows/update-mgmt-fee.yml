name: Update Management Fee Data

on:
  # 매월 1일 오전 11시 KST 자동 갱신
  # Cron: '0 2 1 * *' = UTC 02:00 1일 (KST 11:00)
  # K-APT 데이터 제출 지연(-2개월)을 감안하여 월초 1회 실행
  schedule:
    - cron: '0 2 1 * *'
  # 수동 트리거
  workflow_dispatch:
    inputs:
      update_months:
        description: '수집 월 수 (기본 12, 최대 14)'
        required: false
        default: '12'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. K-APT 관리비 API 수집 + D1 갱신
      - name: Fetch management fee data and update D1
        run: npx tsx src/apt-mgmt/scripts/update-mgmt-fee.ts
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_MONTHS: ${{ github.event.inputs.update_months || '2' }}

      # 5. 완료 알림
      - name: Notify completion
        if: success()
        run: echo "✅ Management fee data update completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # 6. 실패 시 GitHub Issue 자동 생성
      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date().toISOString();
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `## 🔴 Management fee data update failed\n\n` +
              `**실패 시간**: ${now}\n` +
              `**실행 유형**: 매월 1일 오전 11시 KST 자동 갱신\n` +
              `**상태**: ❌ Failed\n\n` +
              `### 확인 사항\n` +
              `1. K-APT API 응답 상태 (DATA_GO_KR_API_KEY)\n` +
              `2. Cloudflare D1 접근 권한\n` +
              `3. apt_meta 테이블에 kapt_code 데이터 존재 여부\n` +
              `4. GitHub Secrets 설정 (DATA_GO_KR_API_KEY, CLOUDFLARE_*)\n\n` +
              `### 참고\n` +
              `- [Workflow 로그](${logUrl})\n` +
              `- 스크립트: \`src/apt-mgmt/scripts/update-mgmt-fee.ts\`\n` +
              `- 다음 자동 실행: 다음달 1일 오전 11시 KST (또는 수동 실행)`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Management fee data update failed',
              body: body,
              labels: ['bug', 'apt-mgmt', 'automated']
            });
